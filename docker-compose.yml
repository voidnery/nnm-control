# Production compose — shipped inside the .deb to /opt/nnm-control.
# Images are pre-built by GitHub Actions and published to ghcr.io (public).
# All variables come from /etc/nnm-control/nnm-control.env via the
# systemd unit (docker compose --env-file ...).
services:
  mongo:
    # A container log with no ceiling is a disk with a deadline: four
    # gigabytes accumulated here before anybody looked, on the same
    # machine that later stopped for want of space.
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Intentionally NOT published to host — internal docker network only.

  backend:
    # A container log with no ceiling is a disk with a deadline: four
    # gigabytes accumulated here before anybody looked, on the same
    # machine that later stopped for want of space.
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    image: ghcr.io/${NC_GHCR_OWNER:-voidnery}/nnm-control-api:${NC_VERSION:-latest}
    restart: unless-stopped
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/nnm_control}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_TTL=${JWT_TTL:-12h}
      - SETUP_TOKEN=${SETUP_TOKEN}
      - ZABBIX_TOKEN=${ZABBIX_TOKEN}
      - MEDIA_SPOOL_DIR=/var/lib/nnm-control/media-spool
      - GEOIP_DIR=/var/lib/nnm-control/geoip
      - HOST_FS=/host
    volumes:
      - /:/host:ro
      # iter12 m3 — media waiting for an agent to collect it. Its own volume on
      # purpose: a 2 GB upload landing on the same filesystem as the database
      # is how a panel takes its own Mongo down, and this is the one place an
      # operator can look at, measure and cap.
      - media_spool:/var/lib/nnm-control/media-spool
      # iter20 m1 — the offline geolocation database. Its own volume so that
      # re-pulling a 124 MB City edition cannot crowd out queued media, and so
      # an operator can drop it without touching anything else.
      - geoip_db:/var/lib/nnm-control/geoip
    depends_on:
      - mongo

  web:
    # A container log with no ceiling is a disk with a deadline: four
    # gigabytes accumulated here before anybody looked, on the same
    # machine that later stopped for want of space.
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    image: ghcr.io/${NC_GHCR_OWNER:-voidnery}/nnm-control-web:${NC_VERSION:-latest}
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-_}
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      - backend

volumes:
  geoip_db:
    # A container log with no ceiling is a disk with a deadline: four
    # gigabytes accumulated here before anybody looked, on the same
    # machine that later stopped for want of space.
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
  mongo_data:
    # A container log with no ceiling is a disk with a deadline: four
    # gigabytes accumulated here before anybody looked, on the same
    # machine that later stopped for want of space.
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
  media_spool:
    # A container log with no ceiling is a disk with a deadline: four
    # gigabytes accumulated here before anybody looked, on the same
    # machine that later stopped for want of space.
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
