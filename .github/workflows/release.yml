# Release pipeline: on tag vX.Y.Z —
#   1) resolve the version once, from frontend/package.json,
#   2) build & push api/web images to ghcr.io (public),
#   3) build the .deb,
#   4) build a signed APT repository and publish it to the gh-pages branch
#      (served by GitHub Pages at https://<owner>.github.io/nnm-control/apt),
#   5) attach that one .deb to a GitHub Release.
#
# The tag must equal frontend/package.json. Use `packaging/tag-release.sh`,
# which derives the tag rather than asking a person to remember it — the one
# time that coupling was left to memory, `v1.8.7` was pushed against a tree
# saying 0.59.0 and every job died on its first step with nothing published.
#
# Required repository setup (one-time):
#   - Settings -> Pages: deploy from branch "gh-pages", folder "/ (root)".
#   - Secret APT_GPG_PRIVATE_KEY: ASCII-armored private key
#       (gpg --full-generate-key; gpg --armor --export-secret-keys <id>)
#   - Secret APT_GPG_KEY_ID: the key id or email.
#   - Secret APT_GPG_PASSPHRASE (optional): only if the key is passphrase-protected.
#   - After first release: make both ghcr packages public
#       (Packages -> nnm-control-api / -web -> Package settings -> Change visibility).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

# One release at a time, and no overlapping Pages deployments.
#
# Without this every re-run adds a deployment for the same branch commit, and
# GitHub cancels the earlier one to make way — so a run re-tried to fix a
# stuck deployment is a run that cancels the deployment it was waiting for.
# `cancel-in-progress: false` because a release that is half-published is
# worse than one that waits: the deb is already attached and the images are
# already pushed by the time Pages runs.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Resolved once and consumed by both jobs. It used to be computed twice, in
  # two copies of the same shell block — which is the same drift this check
  # exists to catch, one level up.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_tag: ${{ steps.v.outputs.image_tag }}
      deb_version: ${{ steps.v.outputs.deb_version }}
      deb_file: ${{ steps.v.outputs.deb_file }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # Single source of truth for the version is frontend/package.json.
          # The tag only *names* the release; if it disagrees, the two-scheme
          # drift that stranded apt upgrades is back — so fail loudly here
          # rather than ship a mislabelled build.
          raw="${GITHUB_REF_NAME}"
          tag="${raw#v}"
          tag="${tag#[.\-_]}"
          pkgver="$(node -p "require('./frontend/package.json').version")"
          bever="$(node -p "require('./backend/package.json').version")"
          if [ "$tag" != "$pkgver" ]; then
            echo "::error::tag '$raw' -> '$tag' does not match frontend/package.json ($pkgver). Tag with packaging/tag-release.sh instead of by hand."
            exit 1
          fi
          if [ "$bever" != "$pkgver" ]; then
            echo "::error::backend/package.json ($bever) disagrees with frontend/package.json ($pkgver); the panel would report a version it was not built as"
            exit 1
          fi
          # Docker tags cannot contain a colon, so images carry the bare
          # version. The .deb carries a Debian epoch (1:) so the 0.x scheme
          # sorts above the stray 1.x versions already in the pool and
          # `apt upgrade` offers it; postinst strips the epoch back off for
          # the image tag it pulls.
          echo "image_tag=$pkgver" >> "$GITHUB_OUTPUT"
          echo "deb_version=1:$pkgver" >> "$GITHUB_OUTPUT"
          echo "deb_file=nnm-control_${pkgver}_all.deb" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "releasing $pkgver (deb 1:$pkgver)" >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: meta
    runs-on: ubuntu-latest
    # A hung network step should cost minutes, not the six hours a job is
    # allowed by default.
    timeout-minutes: 30
    env:
      # Optional. Anonymous pulls from Docker Hub are rate-limited per source
      # IP, and GitHub's runners share theirs — which is one of the two ways
      # "Booting builder" fails without anything being wrong with the code.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      # Sign in to Docker Hub first when credentials exist, so pulling the
      # BuildKit image is not an anonymous, rate-limited request. Skipped
      # entirely when the secrets are absent.
      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # setup-buildx starts a BuildKit container, which it pulls from Docker
      # Hub. That pull is the pipeline's only dependency on Docker Hub, and it
      # is where release v0.21.3 failed: the runner could not reach
      # registry-1.docker.io and no build step ever ran.
      #
      # It cannot simply be dropped — the `docker` driver cannot export the
      # GitHub Actions layer cache this build relies on, and losing that turns
      # every release into a full npm install. So: two attempts, which costs
      # nothing and covers a blip. A Hub outage still fails, and should.
      - id: buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true
      - if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/nnm-control-${{ matrix.name }}:${{ needs.meta.outputs.image_tag }}
            ghcr.io/${{ needs.meta.outputs.owner }}/nnm-control-${{ matrix.name }}:latest
          cache-from: type=gha,scope=nc-${{ matrix.name }}
          cache-to: type=gha,scope=nc-${{ matrix.name }},mode=max

  apt-repo:
    needs: [meta, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The existing pool, taken from the branch rather than from the Pages
      # URL. Pages is a CDN with its own deployment queue; reading the pool
      # from there means a lagging cache silently drops older versions out of
      # the index while their files are still on the branch — rollback breaks
      # and nothing reports an error. On the first release the branch does not
      # exist yet, which is not a failure.
      - id: pool
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg
      - name: Import GPG key
        run: echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
      - name: Build deb
        run: packaging/build-deb.sh "${{ needs.meta.outputs.deb_version }}" "${{ needs.meta.outputs.owner }}"
      - name: Build APT repo
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_POOL_DIR: ${{ steps.pool.outcome == 'success' && format('{0}/gh-pages', github.workspace) || '' }}
          # Fallback only: used when the branch checkout above did not happen.
          APT_PUBLIC_BASE: https://${{ needs.meta.outputs.owner }}.github.io/nnm-control/apt
        run: packaging/build-apt-repo.sh "${{ secrets.APT_GPG_KEY_ID }}"
      - name: Publish repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
      # One file. `dist/` also holds the preserved pool by this point, so a
      # glob would attach every historical version to every Release.
      - name: Attach deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ needs.meta.outputs.deb_file }}
