# NNM-Control: выпуск по версии (D-0036; HQ T-0012) на общем workflow eterix-ci auto-release,
# ревизия eterix-ci — тег v0.2.0. Тег vX.Y.Z руками не ставится: его ставит CI последним шагом выпуска.
#   push в main, VERSION уже выпущена (тег на origin есть) → gate (ci/test.sh: все тесты и аудиты,
#       TAP, ноль тестов — красный; гейт лицензий; gitleaks по истории) → package (build.sh →
#       nnm-control_<VERSION>_all.deb, правила DIST-Control check-deb, SHA256SUMS, клиент публикации
#       против макета). Так и с 1.31.1: тег v1.31.1 уже есть — первый push ничего не выпускает.
#   push в main новой VERSION (тега нет) → выпуск: VERSION = раздел «## X.Y.Z» CHANGELOG → gate →
#       package → e2e пакета на Ubuntu 24.04 (ci/e2e-deb.sh: установка, обновление со снимком,
#       restore, лимит Free, remove/purge — P18) → ingest/1 в beta → GitHub Release (.deb, SHA256SUMS)
#       и тег vX.Y.Z на этот коммит — последним. Упал — тега нет; следующий push или Re-run повторяет.
#   pull request → gate → package
#   вручную (Run workflow): из main — тега нет → выпуск, есть → e2e без выпуска; из defective/X.Y.Z —
#       выпуск DEFECTIVE этого коммита (D-0032; файл DEFECT — README); из другой ветки — отказ.
# stable — только оператор в панели DIST-Control после 72 ч в beta (D-0002); отсюда не продвигается.
# Старый путь (GitHub Pages APT + GHCR, пакет с эпохой 1:) — legacy-apt.yml, только вручную.
#
# ВНИМАНИЕ: reusable workflow приватного eterix-ci доступен только ПРИВАТНЫМ репозиториям. Пока
# nnm-control публичный, этот workflow не запустится («workflow was not found» / нет доступа).
name: release

# PAUSED (HQ T-0049): the repository stays public, so the private eterix-ci cannot be called, and
# DIST-Control does not yet take a version without an epoch (N-0031). Releases go through
# legacy-apt.yml; tests run in tests.yml. To resume, restore the triggers:
#   push: {branches: [main]}  pull_request: {branches: [main]}  workflow_dispatch
on:
  workflow_dispatch:

permissions:
  contents: read

# Pull request — новый прогон отменяет устаревший. Push в main и ручные запуски — в одной очереди:
# один выпуск за раз, идущий не отменяется (внутри eterix-ci публикация ещё и под своим concurrency).
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    permissions:
      contents: write                          # GitHub Release и тег — GITHUB_TOKEN
    uses: voidnery/eterix-ci/.github/workflows/auto-release.yml@v0.2.0
    with:
      # gate: ci/test.sh — npm ci по lock-файлам, все тесты и аудиты (TAP), гейт лицензий; gitleaks
      test-command: bash ci/test.sh
      test-format: tap
      test-files: '*.test.mjs'
      node-version: '22'
      # package: build.sh — vite, production node_modules без нативного кода, .deb, SHA256SUMS
      build-command: bash ./build.sh
      deb: dist/nnm-control_*_all.deb
      package-name: nnm-control
      require-debconf: true                    # вопросы debconf — домен и порт панели
      # e2e пакета (класс B, P18) — в пути выпуска и при ручной проверке; раннер — одноразовая VM с
      # systemd и Docker; на ВМ — та же команда
      gates-command: sudo bash ci/e2e-deb.sh dist
      gates-runs-on: '["ubuntu-24.04"]'
      # выпуск
      files: nnm-control_*_all.deb SHA256SUMS
      release-name: nnm-control
      notes: Тесты, гейт лицензий, правила DIST-Control и e2e пакета на Ubuntu 24.04 (установка, обновление со снимком, restore, лимит Free, remove/purge) — зелёные. Канал входа — beta (D-0003).
      # ingest/1: переменные репозитория DC_URL, DC_PRODUCT (= nnm-control) и секрет DC_TOKEN (GitHub Free —
      # уровень репозитория, передаются явно). Не заданы — publish ПАДАЕТ с причиной, тега нет.
      dc-url: ${{ vars.DC_URL }}
      dc-product: ${{ vars.DC_PRODUCT }}
    secrets:
      DC_TOKEN: ${{ secrets.DC_TOKEN }}
