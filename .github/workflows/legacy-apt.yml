# LEGACY publication path — GitHub Pages APT + public GHCR images. Manual only.
#
# This was the release pipeline up to 1.31.1. Installed clients still update from it: their APT
# source is https://<owner>.github.io/nnm-control/apt and their package is `1:<version>` with the
# stack pulled from ghcr.io/<owner>/nnm-control-{api,web}. The release itself now goes through
# release.yml (eterix-ci auto-release: tests, thin package, ingest into DIST-Control beta, tag).
#
# Since HQ T-0012 this workflow:
#   - runs ONLY by hand (Actions -> legacy-apt -> Run workflow), never on a push or a tag;
#   - takes the version from VERSION (both package.json files must agree with it);
#   - never creates a tag or a GitHub Release — both belong to release.yml. A tag here would make
#     auto-release consider the version released and skip DIST-Control;
#   - refuses to publish a version that does not sort above the pool (build-apt-repo.sh), so a
#     second run of the same version fails instead of republishing.
#
# When to run it: after release.yml has released version X.Y.Z, if clients on the old APT should
# get X.Y.Z too. When to delete it: once every installed client has been moved to DIST-Control and
# eterix-updater (docs/EPOCH-MIGRATION.md) — then also delete packaging/build-deb.sh,
# packaging/build-apt-repo.sh, packaging/tag-release.sh, packaging/debian/, the GHCR images and the
# gh-pages branch, and turn off Pages.
#
#   1) meta      — VERSION, agreement with both package.json files,
#   2) images    — build & push api/web images to ghcr.io (public),
#   3) apt-repo  — build the epoch .deb (1:X.Y.Z), build a signed APT repository, publish it to
#                  the gh-pages branch (served by GitHub Pages at
#                  https://<owner>.github.io/nnm-control/apt).
#
# Required repository setup (one-time):
#   - Settings -> Pages: deploy from branch "gh-pages", folder "/ (root)".
#   - Secret APT_GPG_PRIVATE_KEY: ASCII-armored private key
#       (gpg --full-generate-key; gpg --armor --export-secret-keys <id>)
#   - Secret APT_GPG_KEY_ID: the key id or email.
#   - Secret APT_GPG_PASSPHRASE (optional): only if the key is passphrase-protected.
#   - After first release: make both ghcr packages public
#       (Packages -> nnm-control-api / -web -> Package settings -> Change visibility).
#
#       Each package also carries its own Actions access, separately from the
#       repository's. A package created before this workflow existed, or linked
#       to a different repository, refuses a push from here with
#       "failed to fetch oauth token: denied" while the other image in the same
#       matrix pushes fine — same token, same login. The fix is in
#       Package settings -> Manage Actions access, not in this file.
name: legacy-apt

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One publication at a time, and no overlapping Pages deployments.
#
# Without this every re-run adds a deployment for the same branch commit, and
# GitHub cancels the earlier one to make way — so a run re-tried to fix a
# stuck deployment is a run that cancels the deployment it was waiting for.
# `cancel-in-progress: false` because a publication that is half-done is
# worse than one that waits: the images are already pushed by the time Pages runs.
concurrency:
  group: legacy-apt
  cancel-in-progress: false

jobs:
  # Resolved once and consumed by both jobs. It used to be computed twice, in
  # two copies of the same shell block — which is the same drift this check
  # exists to catch, one level up.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      deb_version: ${{ steps.v.outputs.deb_version }}
      deb_file: ${{ steps.v.outputs.deb_file }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          # VERSION is the single source (ERS/1 §4); both package.json files
          # must agree with it — the panel reports its own version from them.
          ver="$(tr -d '\r\n' < VERSION)"
          for f in frontend/package.json backend/package.json; do
            pv="$(node -p "require('./$f').version")"
            if [ "$pv" != "$ver" ]; then
              echo "::error::$f ($pv) disagrees with VERSION ($ver); bump both"
              exit 1
            fi
          done
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "::error::legacy-apt runs only by hand (workflow_dispatch), not on ${GITHUB_EVENT_NAME}"
            exit 1
          fi

          # Docker tags cannot contain a colon, so images carry the bare
          # version. The .deb carries a Debian epoch (1:) so the 0.x scheme
          # sorts above the stray 1.x versions already in the pool and
          # `apt upgrade` offers it; postinst strips the epoch back off for
          # the image tag it pulls.
          {
            echo "release=true"
            echo "version=$ver"
            echo "deb_version=1:$ver"
            echo "deb_file=nnm-control_${ver}_all.deb"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"
          echo "legacy APT: publishing $ver (deb 1:$ver)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
  images:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    # A hung network step should cost minutes, not the six hours a job is
    # allowed by default.
    timeout-minutes: 30
    env:
      # Optional. Anonymous pulls from Docker Hub are rate-limited per source
      # IP, and GitHub's runners share theirs — which is one of the two ways
      # "Booting builder" fails without anything being wrong with the code.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      # One image at a time. Two jobs pushing to ghcr in the same second is
      # half of what earns a secondary rate limit, and the images are small
      # enough that the serial cost is a minute.
      max-parallel: 1
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      # Sign in to Docker Hub first when credentials exist, so pulling the
      # BuildKit image is not an anonymous, rate-limited request. Skipped
      # entirely when the secrets are absent.
      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # setup-buildx starts a BuildKit container, which it pulls from Docker
      # Hub. That pull is the pipeline's only dependency on Docker Hub, and it
      # is where release v0.21.3 failed: the runner could not reach
      # registry-1.docker.io and no build step ever ran.
      #
      # It cannot simply be dropped — the `docker` driver cannot export the
      # GitHub Actions layer cache this build relies on, and losing that turns
      # every release into a full npm install. So: two attempts, which costs
      # nothing and covers a blip. A Hub outage still fails, and should.
      - id: buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true
      - if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushing to ghcr can be refused by a *secondary* rate limit, which
      # arrives as `denied: permission_denied` with HTTP 403 — wording that
      # reads like a credentials problem and is not one. It is temporary and
      # earned by release frequency, so the answer is to wait and try once
      # more rather than to fail a release that has nothing wrong with it.
      #
      # The layers are already built and cached by the first attempt, so the
      # retry costs the push, not the build.
      - id: push
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/nnm-control-${{ matrix.name }}:${{ needs.meta.outputs.version }}
            ghcr.io/${{ needs.meta.outputs.owner }}/nnm-control-${{ matrix.name }}:latest
          cache-from: type=gha,scope=nc-${{ matrix.name }}
          cache-to: type=gha,scope=nc-${{ matrix.name }},mode=max
      - if: steps.push.outcome == 'failure'
        name: Explain the refusal, then wait
        run: |
          # Two very different failures wear the same word, and the retry only
          # helps one of them.
          #
          #   "exceeded a secondary rate limit"  -> transient, waiting fixes it
          #   "failed to fetch oauth token: denied: denied"  -> permissions on
          #       that one package; waiting changes nothing and the retry burns
          #       two minutes before failing identically
          #
          # The tell is whether the *other* image in this matrix pushed. Same
          # token, same login, same workflow: if one succeeded and one did not,
          # the credentials are fine and the package is not.
          {
            echo "### Push refused for nnm-control-${{ matrix.name }}"
            echo
            echo "If the log says **exceeded a secondary rate limit**, this is temporary —"
            echo "the retry below usually clears it."
            echo
            echo "If it says **failed to fetch oauth token: denied**, the credentials are"
            echo "fine and this package's permissions are not. Check that the other image"
            echo "in this run pushed: same token, same login. Then go to"
            echo "Packages → nnm-control-${{ matrix.name }} → Package settings →"
            echo "Manage Actions access, and give this repository the Write role."
            echo "Waiting will not help and the retry below will fail the same way."
          } >> "$GITHUB_STEP_SUMMARY"
          sleep 120
      - if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/nnm-control-${{ matrix.name }}:${{ needs.meta.outputs.version }}
            ghcr.io/${{ needs.meta.outputs.owner }}/nnm-control-${{ matrix.name }}:latest
          cache-from: type=gha,scope=nc-${{ matrix.name }}
          cache-to: type=gha,scope=nc-${{ matrix.name }},mode=max

  apt-repo:
    needs: [meta, images]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The existing pool, taken from the branch rather than from the Pages
      # URL. Pages is a CDN with its own deployment queue; reading the pool
      # from there means a lagging cache silently drops older versions out of
      # the index while their files are still on the branch — rollback breaks
      # and nothing reports an error. On the first release the branch does not
      # exist yet, which is not a failure.
      - id: pool
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg
      - name: Import GPG key
        run: echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
      - name: Build deb
        run: packaging/build-deb.sh "${{ needs.meta.outputs.deb_version }}" "${{ needs.meta.outputs.owner }}"
      - name: Build APT repo
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_POOL_DIR: ${{ steps.pool.outcome == 'success' && format('{0}/gh-pages', github.workspace) || '' }}
          # Fallback only: used when the branch checkout above did not happen.
          APT_PUBLIC_BASE: https://${{ needs.meta.outputs.owner }}.github.io/nnm-control/apt
        run: packaging/build-apt-repo.sh "${{ secrets.APT_GPG_KEY_ID }}"
      - name: Publish repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
      # No tag and no GitHub Release here (HQ T-0012): both belong to release.yml
      # (eterix-ci auto-release), which sets the tag last, after ingest into
      # DIST-Control. A tag from this workflow would make auto-release treat the
      # version as released and never publish it to DIST-Control. The epoch .deb
      # lives in the APT pool on gh-pages; the Release carries the thin package.
